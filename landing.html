<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparkora - Discover Your Match</title>
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #1b0204 0%, #0d0002 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px 20px;
      overflow-x: hidden;
    }

    .landing-card {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(180deg, #220407 0%, #110103 100%);
      border: 1px solid rgba(153, 27, 27, 0.4);
      border-radius: 28px;
      padding: 40px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      text-align: center;
      margin: auto 0;
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(90deg, #b91c1c 0%, #7f1d1d 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 6px 20px rgba(127, 29, 29, 0.5);
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-secondary {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 15px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-primary:hover, .btn-secondary:hover {
      opacity: 0.95;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(239, 68, 68, 0.5);
    }
  </style>
</head>
<body>

  <!-- Top Space / Header Spacer -->
  <div></div>

  <!-- Landing Hero Card -->
  <div class="landing-card">
    
    <!-- Flame Icon & App Name -->
    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px;">
      <i class="bi bi-fire" style="color: #f83b3b; font-size: 38px;"></i>
      <span style="font-weight: 900; font-size: 32px; letter-spacing: 0.08em; text-transform: uppercase; color: #ffffff;">Sparkora</span>
    </div>

    <!-- Hero Tagline -->
    <div style="margin-bottom: 36px;">
      <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 10px; color: #ffffff; line-height: 1.2;">Spark Real Connections</h1>
      <p style="font-size: 13.5px; color: #a38f91; line-height: 1.5;">Discover singles near you, match instantly, and start meaningful conversations today.</p>
    </div>

    <!-- Action Buttons Container -->
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <!-- Link to Signup Page -->
      <a href="signup.html" class="btn-primary">Create Account</a>
      
      <!-- Link to Login Page -->
      <a href="login.html" class="btn-secondary">Log In</a>
    </div>

  </div>

  <!-- Footer Copyright / Info -->
  <div style="font-size: 11px; color: #735e61; text-align: center; padding-top: 20px;">
    &copy; 2026 Sparkora Inc. All rights reserved.
  </div>

</body>
</html>
