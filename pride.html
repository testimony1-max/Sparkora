<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparkora Pride</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="sparkora.css">
  <style>
    .hero{background:linear-gradient(180deg,#220407,#110103);border:1px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center;margin-bottom:22px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
    .big-icon{width:60px;height:60px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(135deg,#ef4444,#991b1b)}
    .hero h1{font-size:30px;font-weight:900;margin-bottom:6px}.hero p{font-size:14px;color:#d1d5db;max-width:480px;margin:0 auto 16px;line-height:1.5}
    .stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.stat{background:rgba(255,230,230,.92);color:#1a0204;border-radius:12px;padding:8px 14px;font-size:12px;font-weight:800}.stat span{display:block;font-size:10px;color:#4b5563;font-weight:700}
    .gate{position:relative}.gate .grid{filter:blur(9px);pointer-events:none;user-select:none;opacity:.7}
    .paywall{position:absolute;left:50%;top:40px;transform:translateX(-50%);width:min(92%,380px);background:linear-gradient(180deg,#2a0408,#140103);border:1px solid rgba(239,68,68,.5);border-radius:24px;padding:22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6);z-index:5}
    .paywall .lk2{width:52px;height:52px;border-radius:50%;background:rgba(239,68,68,.2);color:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:24px}
    .paywall h2{font-size:20px;font-weight:900}.paywall .pr{font-size:34px;font-weight:900;margin:8px 0 0}.paywall .pr small{font-size:13px;color:#d1d5db;font-weight:600}
    .paywall ul{list-style:none;text-align:left;font-size:13px;margin:12px 0;display:grid;gap:6px}.paywall li::before{content:'\2713';color:#22c55e;font-weight:900;margin-right:8px}
    .okbar{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:16px;font-size:13px;font-weight:700;color:#86efac}
  </style>
</head>
<body>
<div class="wrap">
  <div class="seg two" role="tablist">
    <button class="sap" id="tab-lesbian" role="tab"><i class="bi bi-heart-fill"></i> Sapphic Sparks</button>
    <button id="tab-gay" role="tab"><i class="bi bi-fire"></i> Gay Flames</button>
  </div>
  <div class="hero">
    <div class="big-icon"><i class="bi" id="hi"></i></div>
    <h1 id="ht"></h1><p id="hx"></p>
    <div class="stats"><div class="stat" id="s1"></div><div class="stat" id="s2"></div><div class="stat" id="s3"></div></div>
  </div>
  <div id="body"></div>
</div>
<script src="sparkora.js"></script>
<script>
(function(){
const {$,$$,esc}=S;
S.mountNav('pride');
const SP={
  lesbian:{icon:'bi-heart-fill',title:'Sapphic Sparks',text:'A warm, safe space for women who love women. Meet people who get you and feel the spark.',stats:[['2.4k','Active now'],['86','New matches today'],['94%','Verified']],list:'Women near you'},
  gay:{icon:'bi-fire',title:'Gay Flames',text:'A bold, welcoming space for men who love men. Find real connections, from first dates to forever.',stats:[['3.1k','Active now'],['102','New matches today'],['92%','Verified']],list:'Men near you'}
};
let cur=new URLSearchParams(location.search).get('space');if(!SP[cur])cur='lesbian';
function likeBtn(p){const m=S.matches().includes(p.id),l=S.likes().find(x=>x.id===p.id);return m?'<div class="btns"><a class="btn" href="messages.html?c='+p.id+'">Message</a></div>':'<div class="btns"><button class="btn" data-like="'+p.id+'"'+(l?' disabled':'')+'><i class="bi bi-heart-fill"></i> '+(l?'Liked':'Like')+'</button><button class="btn ghost" data-view="'+p.id+'" aria-label="View profile"><i class="bi bi-person"></i></button></div>'}
function render(){
  const s=SP[cur],prem=S.isPremium();
  $('#tab-lesbian').classList.toggle('on',cur==='lesbian');$('#tab-gay').classList.toggle('on',cur==='gay');
  $('#hi').className='bi '+s.icon;$('#ht').textContent=s.title;$('#hx').textContent=s.text;
  s.stats.forEach((x,i)=>$('#s'+(i+1)).innerHTML=x[0]+'<span>'+x[1]+'</span>');
  const people=S.people.filter(p=>p.space===cur);
  const grid='<div class="grid">'+people.map(p=>S.cardHTML(p,prem?likeBtn(p):'')).join('')+'</div>';
  if(prem){$('#body').innerHTML='<div class="okbar"><i class="bi bi-patch-check-fill"></i> Premium active</div><h2 style="font-size:16px;font-weight:800;margin:0 0 12px 4px">'+s.list+'</h2>'+grid;return}
  $('#body').innerHTML='<div class="gate">'+grid+'<div class="paywall"><div class="lk2"><i class="bi bi-lock-fill"></i></div><h2>'+esc(s.title)+' is Premium</h2><div class="pr"><span data-price="'+S.CFG.PRICE_USD+'">…</span> <small>/ month</small></div><ul><li>Browse and match in this space</li><li>Prices shown in your local currency</li><li>Cancel anytime</li></ul><button class="btn full" id="go"><i class="bi bi-credit-card-2-front-fill"></i> Go Premium</button><p class="fine">You will be asked to link a payment card.</p></div></div>';
  $('#go').onclick=()=>S.openPremium();S.hydrate();
}
$('#tab-lesbian').onclick=()=>{cur='lesbian';history.replaceState(null,'','?space=lesbian');render()};
$('#tab-gay').onclick=()=>{cur='gay';history.replaceState(null,'','?space=gay');render()};
$('#body').onclick=e=>{
  const l=e.target.closest('[data-like]');if(l){S.likeFlow(+l.dataset.like,false);S.mountNav('pride');render();return}
  const v=e.target.closest('[data-view]');if(v)S.viewProfile(S.byId(v.dataset.view));
};
window.addEventListener('sp:premium',render);window.addEventListener('sp:change',render);
render();
})();
</script>
</body>
</html>
