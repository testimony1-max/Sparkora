<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparkora - Login</title>
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #1b0204 0%, #0d0002 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(180deg, #220407 0%, #110103 100%);
      border: 1px solid rgba(153, 27, 27, 0.4);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: #ef4444;
      background: rgba(255, 255, 255, 0.08);
    }

    .form-input::placeholder {
      color: #8c787a;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(90deg, #b91c1c 0%, #7f1d1d 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(127, 29, 29, 0.5);
      transition: opacity 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- Top Brand Logo (Links to Dashboard) -->
  <a href="index.html" style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px; text-decoration: none; cursor: pointer;">
    <i class="bi bi-fire" style="color: #f83b3b; font-size: 30px;"></i>
    <span style="font-weight: 900; font-size: 26px; letter-spacing: 0.08em; text-transform: uppercase; color: #ffffff;">Sparkora</span>
  </a>

  <!-- Login Card Box -->
  <div class="login-container">
    
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 style="font-size: 22px; font-weight: 800; margin-bottom: 6px; color: #ffffff;">Welcome Back</h1>
      <p style="font-size: 13px; color: #a38f91;">Log in to your Sparkora account to continue discovering matches</p>
    </div>

    <!-- Login Form (Redirects to index.html on submit) -->
    <form action="index.html" method="GET" style="display: flex; flex-direction: column; gap: 16px;">
      
      <!-- Email Address -->
      <div>
        <label style="display: block; font-size: 12px; font-weight: 700; color: #d1d5db; margin-bottom: 6px;">Email Address</label>
        <input type="email" placeholder="name@example.com" required class="form-input">
      </div>

      <!-- Password -->
      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label style="font-size: 12px; font-weight: 700; color: #d1d5db;">Password</label>
          <a href="#" style="font-size: 11px; color: #ef4444; text-decoration: none;">Forgot password?</a>
        </div>
        <input type="password" placeholder="Enter your password" required class="form-input">
      </div>

      <!-- Remember Me Checkbox -->
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 11.5px; color: #a38f91;">
        <input type="checkbox" style="accent-color: #ef4444; cursor: pointer;">
        <span>Remember me on this device</span>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn" style="margin-top: 8px;">Log In</button>

    </form>

    <!-- Footer Switch to Signup -->
    <div style="text-align: center; margin-top: 20px; font-size: 12.5px; color: #a38f91;">
      Don't have an account yet? <a href="signup.html" style="color: #ef4444; font-weight: 700; text-decoration: none;">Sign up</a>
    </div>

  </div>

</body>
</html>
