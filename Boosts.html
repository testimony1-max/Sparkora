<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparkora · Boosts</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="sparkora.css">
<style>
.bs{display:flex;align-items:center;gap:14px}.bs .big{width:56px;height:56px;border-radius:50%;background:rgba(239,68,68,.2);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:26px}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:14px}
.pack{background:linear-gradient(180deg,#2a0408,#140103);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:18px;text-align:center;position:relative}
.pack.best{border-color:var(--red)}.pack .tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--red);font-size:10px;font-weight:800;padding:2px 10px;border-radius:10px}
.pack h3{font-size:20px;font-weight:900}.pack .pp{font-size:22px;font-weight:900;margin:8px 0 12px}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="page-h">Boosts</h1><p class="sub">A Boost puts your profile at the front of the line for 30 minutes.</p>
  <div class="panel"><div class="bs"><div class="big"><i class="bi bi-lightning-fill"></i></div><div style="flex:1"><div style="font-weight:800;font-size:16px" id="st"></div><div id="st2" style="color:#9ca3af;font-size:12px"></div></div><button class="btn red" id="use">Use a Boost</button></div></div>
  <h2 style="font-size:16px;margin:22px 0 0 4px">Get more Boosts</h2>
  <div class="packs" id="packs"></div>
  <p class="fine">Prices are shown in your local currency. You will be asked to link a payment card.</p>
</div>
<script src="sparkora.js"></script>
<script>
(function(){
const {$,$$}=S;S.mountNav('boosts');
const PK=[[1,2.99,'1 Boost'],[5,9.99,'5 Boosts'],[10,15.99,'10 Boosts']];
function draw(){
  const b=S.boost(),act=S.boostActive();
  $('#st').textContent=act?'Boost active':(b.credits?b.credits+' Boost'+(b.credits>1?'s':'')+' available':'No Boosts left');
  $('#st2').textContent=act?Math.max(1,Math.ceil((b.until-Date.now())/6e4))+' minutes left':'Each Boost lasts 30 minutes.';
  $('#use').disabled=act||!b.credits;$('#use').textContent=act?'Running…':'Use a Boost';
}
$('#packs').innerHTML=PK.map((p,i)=>'<div class="pack'+(i===1?' best':'')+'">'+(i===1?'<span class="tag">BEST VALUE</span>':'')+'<h3>'+p[2]+'</h3><div class="pp" data-price="'+p[1]+'">…</div><button class="btn full" data-b="'+i+'">Buy</button></div>').join('');
S.hydrate();
$('#use').onclick=()=>{const r=S.activateBoost();S.toast(r==='ok'?'Boost activated for 30 minutes':'Cannot start a Boost');draw();S.mountNav('boosts')};
$('#packs').onclick=e=>{
  const b=e.target.closest('[data-b]');if(!b)return;const p=PK[+b.dataset.b];
  S.requireCard(async()=>{
    const pr=await S.pricing(),price=S.money(p[1],pr),c=S.card();
    if(await S.confirmBox({title:'Buy '+p[2],body:'Charge '+price+' to '+c.brand+' ending in '+c.last4+'?',ok:'Pay '+price})){S.addBoosts(p[0]);S.toast(p[2]+' added');draw()}
  });
};
draw();setInterval(draw,20000);
})();
</script>
</body></html>
